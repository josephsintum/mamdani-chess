[package]
name = "server"
version = "0.1.0"
description = "Pothole Chess: Mamdani Edition game server (Rust experiment)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
cookie = "0.18"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rand = "0.10.3"
rules = { version = "0.1.0", path = "../rules" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
bytes = "1.12.1"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "stream"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt-multi-thread"] }

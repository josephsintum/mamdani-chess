[workspace]
resolver = "3"
members = ["rules", "server"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
future-incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
# Squares, files and ranks move between u8, i8 and usize all the time; every
# cast is range-checked by construction (0..64, 0..8).
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
debug = "line-tables-only"

[profile.dev.package.rules]
# Perft and the random-game tests are slow unoptimised.
opt-level = 2
